[package]
name = "kleb"
version = "0.2.0"
edition = "2024"
readme = "README.md"
license = "MIT"
authors = ["Gaurav Sablok"]
description = "kelp machine learning"
homepage = "https://codeberg.org/gsablok/kelpdeep"
repository = "https://codeberg.org/gsablok/keldeep"
keywords = ["bioinformatics", "genomics"]



[dependencies]
clap = { version = "4.5.57", features = ["derive"] }
csv = "1.4.0"
figlet-rs = "0.1.5"
ndarray = "0.17.2"
ndarray-csv = "0.5.4"
rayon = "1.11.0"
smartcore = { version = "0.4.9", features = ["ndarray-bindings"] }
